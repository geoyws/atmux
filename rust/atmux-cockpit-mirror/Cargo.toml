[package]
name = "atmux-cockpit-mirror"
version = "0.1.0"
edition = "2021"
description = "Cockpit-scope event-consumer daemon — subscribes to ~/.atmux/cockpit-events.db NOTIFY, drains whitelisted topics, dispatches Bun per event for fleet-scoped handler execution. ADR-219."
license = "MIT"
publish = false

[dependencies]
honker = { version = "0.3.3", features = ["bundled-sqlite"] }
rusqlite = { version = "0.39", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Linux-only — PR_SET_PDEATHSIG so the mirror dies when its tmux-pane
# parent dies, even via SIGKILL. No-op on other platforms.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[features]
default = []
kernel-watcher = ["honker/kernel-watcher"]
shm-fast-path = ["honker/shm-fast-path"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[[bin]]
name = "atmux-cockpit-mirror"
path = "src/main.rs"
