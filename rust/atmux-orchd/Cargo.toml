[package]
name = "atmux-orchd"
version = "0.1.0"
edition = "2021"
description = "Per-team event-router daemon — subscribes to Honker NOTIFY, drains events table, dispatches Bun per event for handler execution"
license = "MIT"
publish = false

[dependencies]
honker = { version = "0.3.3", features = ["bundled-sqlite"] }
rusqlite = { version = "0.39", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Linux-only — PR_SET_PDEATHSIG so the orchd dies when its tmux-pane
# parent dies, even via SIGKILL. No-op on other platforms.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[features]
default = []
kernel-watcher = ["honker/kernel-watcher"]
shm-fast-path = ["honker/shm-fast-path"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[[bin]]
name = "atmux-orchd"
path = "src/main.rs"
