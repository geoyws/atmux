[package]
name = "atmux-listener"
version = "0.1.0"
edition = "2021"
description = "Subprocess that wraps honker::Database.listen() to stream NOTIFY wake-ups over stdout"
license = "MIT"
publish = false

[dependencies]
honker = { version = "0.3.3", features = ["bundled-sqlite"] }

# Linux-only — PR_SET_PDEATHSIG so the listener dies when the Bun
# parent dies, even via SIGKILL. No-op on other platforms (macOS dev
# path stays poll-mode for now).
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[features]
# Default: PRAGMA data_version polling inside honker (same as honker's
# Python/Node bindings use by default).
default = []
# Opt-in: notify-rs filesystem events on the SQLite WAL file. True
# kernel-blocking wake (~1ms). Set ATMUX_LISTENER_KERNEL_WATCHER=1 at
# build time + add this feature to enable. See ADR-202 §Amendment
# 2026-05-22.
kernel-watcher = ["honker/kernel-watcher"]
shm-fast-path = ["honker/shm-fast-path"]

[profile.release]
# Optimize for binary size — this is a tiny subprocess, not a hot path.
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[[bin]]
name = "atmux-listener"
path = "src/main.rs"
