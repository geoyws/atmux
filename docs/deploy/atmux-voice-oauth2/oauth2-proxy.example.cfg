# atmux voice — oauth2-proxy config (ADR-272 §Security phase O2)
#
# Derived from the working dash.geoy.ws config. Every value that MUST differ
# from dash is marked. Secrets are read from mounted files, never inlined.

provider              = "oidc"
provider_display_name = "Unum ID"
oidc_issuer_url       = "https://id-staging.u-n-u-m.com/realms/unum"

# DIFFERS FROM DASH — its own Keycloak client, so voice access can be revoked
# without touching dash, and so the audit trail separates the two.
client_id             = "atmux-voice"
client_secret_file    = "/run/secrets/voice_oidc_client_secret"
cookie_secret_file    = "/run/secrets/voice_oidc_cookie_secret"

# DIFFERS FROM DASH
redirect_url          = "https://atmux.geoy.ws/oauth2/callback"

scope                 = "openid profile email"
code_challenge_method = "S256"
email_domains         = ["*"]

# DIFFERS FROM DASH — create this group in realm `unum` and add yourself.
# With an empty/absent group nobody gets in, which is the correct direction to
# fail. Voice can drive tmux agents, so this list should stay a list of one.
allowed_groups        = ["/atmux-operators"]

# DIFFERS FROM DASH — a distinct cookie name. Sharing dash's would let one
# session ride the other's cookie on the same parent domain.
cookie_name           = "__Host-atmux_voice_oidc"
cookie_secure         = true
cookie_httponly       = true
cookie_samesite       = "lax"
cookie_path           = "/"
cookie_refresh        = "4m"

# DIFFERS FROM DASH (8h → 12h). A voice session is used one-handed, away from
# a keyboard, often overnight; re-authenticating through a Keycloak redirect on
# a phone mid-incident is exactly the friction this feature exists to remove.
# Still short enough that a lost phone is not an indefinite grant.
cookie_expire         = "12h"

cookie_csrf_per_request = true
cookie_csrf_expire      = "10m"

reverse_proxy         = true

# DIFFERS FROM DASH — MUST be this compose network's gateway, not dash's.
# Wrong value ⇒ the proxy trusts the wrong hop and mis-reads the client IP.
trusted_proxy_ips     = ["172.31.241.1/32"]

set_xauthrequest      = true
pass_access_token     = false
pass_authorization_header = false

# Leave every one of these false. They exist to work around broken IdPs;
# Keycloak is not one, and each weakens a real check.
skip_oidc_discovery                    = false
insecure_oidc_skip_issuer_verification = false
insecure_oidc_allow_unverified_email   = false
insecure_oidc_skip_nonce               = false

skip_provider_button  = true
whitelist_domains     = ["id-staging.u-n-u-m.com", "atmux.geoy.ws"]
backend_logout_url    = "https://id-staging.u-n-u-m.com/realms/unum/protocol/openid-connect/logout?id_token_hint={id_token}"

# auth_request mode: nginx asks /oauth2/auth and the proxy answers 202/401.
# It never proxies the app itself — nginx does.
upstreams             = ["static://202"]

# DIFFERS FROM DASH — 14181, not 14180.
http_address          = "0.0.0.0:14181"
