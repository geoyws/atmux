# bunfig.toml — Bun runtime + test config
# See: https://bun.sh/docs/runtime/bunfig

[test]
# Coverage gate per ADR-009 + PLAN.md §8.1 (100% narrowed denominator).
# Reviewer's 8-check protocol step 2 enforces this on every commit.
coverage = true
coverageReporter = ["text", "lcov"]
coverageDir = "coverage"
# Per ADR-009 §2 — line/function/statement/branch all 100%.
coverageThreshold = { line = 1.0, function = 1.0, statement = 1.0, branch = 1.0 }
# Test files don't count toward the denominator (they execute themselves
# at 100% trivially — including them dilutes the signal).
coverageSkipTestFiles = true
# Narrowed denominator (ADR-009 §2). Code outside these patterns is
# tracked at 100%; matching paths are excluded from the gate.
coveragePathIgnorePatterns = [
  "src/types/generated/",
  "src/cli.ts",
  "**/index.ts",
  "tests/",
  "**/*.fixtures.ts",
]

# [install] frozenLockfile is intentionally NOT set here — bunfig.toml
# applies to ALL bun invocations including `bun add`, which would then
# fail to resolve new deps locally. CI invokes `bun install --frozen-lockfile`
# explicitly (see .github/workflows/ci.yml) for the same gate without
# the local-dev breakage.
