<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover so safe-area insets are real on notched phones -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#16161e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="atmux voice" />
    <title>atmux voice</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="stylesheet" href="/css/app.css" />
    <!-- No service worker, on purpose: ADR-272 D11 — a cached app.js
         speaking last week's protocol to today's server is the one
         failure a phone cannot recover from. Assets are no-store. -->
  </head>
  <body data-state="idle">
    <header id="rail">
      <span id="dot" class="dot dead" aria-hidden="true"></span>
      <span id="provider">offline</span>
      <span id="model"></span>
      <span id="readonly" hidden>ro</span>
      <button id="team" type="button" disabled aria-label="Switch team">no team</button>
    </header>

    <main id="transcript" aria-live="polite" aria-label="Conversation transcript"></main>

    <div id="errstrip" role="alert" hidden>
      <span id="errstrip-text"></span>
      <button id="errstrip-action" type="button" hidden></button>
      <button id="errstrip-dismiss" type="button" aria-label="Dismiss">✕</button>
    </div>

    <footer id="deck">
      <button id="mic" type="button" aria-pressed="false" aria-label="Push to talk">
        <span class="ring" aria-hidden="true"></span>
        <span class="rms" aria-hidden="true"></span>
        <span id="mic-label">HOLD TO TALK</span>
      </button>
      <div id="mic-hint">hold to talk · tap while speaking to interrupt</div>
    </footer>

    <div id="resume-overlay" class="overlay" hidden role="button" tabindex="0"
      aria-label="Tap to resume audio">
      <div class="overlay-title">tap to resume audio</div>
      <div class="overlay-sub">the browser suspended the audio engine while the screen was off</div>
    </div>

    <div id="takeover-overlay" class="overlay" hidden>
      <div class="overlay-title">session taken over elsewhere</div>
      <div class="overlay-sub">another device claimed this voice session — close this tab or reopen
        the tokened link to take it back</div>
    </div>

    <script type="module" src="/js/app.js"></script>
  </body>
</html>
