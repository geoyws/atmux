# atmux canonical tmux.conf (ADR-162 §Decision-anchor #2 + #3).
#
# DO NOT EDIT — atmux owns this file. The option baseline pins the
# runtime contract for ADR-135 (window naming), ADR-138 (verified
# send-keys), and ADR-058 (cage-tier isolation); the environment scrub
# pins ADR-277 (cage TUIs render in colour). Note ADR-162
# §Decision-anchor #3 says "8 baseline options" — the shipped count is
# 9, because ADR-190 added the explicit status-interval without
# amending that number. Recorded here rather than silently reconciled.
# Operator overrides
# via the ATMUX_TMUX_CONF env var (returns the override verbatim;
# ADR-162 §Part B). A future user-override path at
# ~/.config/atmux/tmux.conf.local lands with ADR-163 (forward-ref);
# this file intentionally does NOT source-file it yet.
#
# atmux quarantines the operator's personal ~/.tmux.conf — every
# atmux invocation passes `-f <this-file>`, so inheritance is closed.

# Status line — atmux owns it.
set -g status on

# Status refresh cadence. Codified explicitly per ADR-190 Rule 3
# (was relying on tmux's 15s default; pinned so personal-config drift
# can't tighten it below the helper TTL floor). The cage statusline is
# zero-fork per ADR-190 Rule 1 — tmux builtin format expansions only,
# NO shell-command-format forks (they re-evaluate on every pane-activity
# event under tmux 3.6a, causing a fork-storm at multi-team-of-teams
# scale). Operator-curated shell-format richness belongs in
# ~/.config/atmux/tmux.conf.local (ADR-171), delegating to the
# TTL-cached helpers (ADR-190 Rule 2).
set -g status-interval 15

# Operator convenience.
set -g mouse on

# Scrollback for capture-pane (ADR-138 send-keys verifier reads recent
# pane state; whip / poke / sentinel observation; refusal-classifier).
set -g history-limit 100000

# Color stability across operator terminals.
set -g default-terminal "tmux-256color"

# Colour stability part 2 — scrub NO_COLOR from the cage environment
# (ADR-277). A tmux server freezes its own environ at start and hands
# it to every pane it later creates. Cages are routinely started from
# inside an agent's Bash tool, whose environment carries NO_COLOR=1
# (plus TERM=dumb and an empty COLORTERM) so that captured command
# output is plain text. tmux re-derives TERM per pane from
# default-terminal above, but NO_COLOR is not in update-environment, so
# it survives into every shell and every TUI in the cage — Claude Code,
# codex and opencode all honour the convention and render monochrome,
# for the life of the server. `-r` marks the variable for REMOVAL from
# the environment of new processes, which is the correct verb whether
# or not the launching environment set it (a no-op when it did not).
set-environment -gr NO_COLOR

# Colour stability part 3 — the SERVER-level half of the colour policy
# (ADR-281 §D2, added 2026-08-28). An agent Bash tool exports COLORTERM
# EMPTY alongside NO_COLOR=1, and a tmux server freezes that too.
#
# Read the asymmetry before touching this line, because the two halves
# look identical and only one is safe:
#
#   SERVER-side (here) is ours to set. Measured on this box, tmux 3.7c,
#   2026-08-28: with this option set and the attaching client's own
#   environment carrying no COLORTERM, `#{client_termfeatures}` came back
#   `bpaste,ccolour,clipboard,cstyle,focus,title` — no RGB. So the option
#   does NOT make tmux advertise 24-bit colour on the operator's behalf.
#
#   CLIENT-side is NOT. Putting COLORTERM in the environment of the tmux
#   CLIENT process adds RGB to that same feature list, so tmux stops
#   downconverting and writes raw 24-bit SGR at a terminal that never
#   claimed to understand it. atmux therefore injects no colour variable
#   at the spawn seam; ADR-281 §D2 withdrew that half outright.
#
# On tmux 3.7c this line is INERT for the pane — tmux sets
# COLORTERM=truecolor in every pane itself, overriding the server environ
# (measured: a pane on this server reports COLORTERM=truecolor with or
# without the line). It is here for the tmux 3.6b servers ADR-281
# measured with COLORTERM= empty, where the pane does inherit the frozen
# value. `-g` sets it on the server's global environment, so every pane
# inherits it; there is deliberately no `-r`, because the intent is to
# SET a value rather than remove one.
set-environment -g COLORTERM truecolor

# Window names: atmux owns the emoji-prefix formatter (ADR-135
# `buildWindowName`). tmux-side renaming MUST be off; otherwise the
# default-shell title overrides the canonical name on every pane spawn.
set -g allow-rename off
set -g automatic-rename off

# Match worktree-isolation conventions (ADR-082 / ADR-084).
set -g base-index 1

# Responsive but doesn't break esc-sequence emoji rendering on the
# cockpit window-name display.
set -g escape-time 50

# Prefix: tmux default C-b (no surprise for operators who attach
# directly via `tmux -L atmux-cockpit attach`). Custom prefixes belong
# in an ATMUX_TMUX_CONF override.

# User override (ADR-171) — silent no-op if file absent. Loaded LAST
# so operator-options override the bundled defaults. Operators with a
# curated ~/.tmux.conf can put `source-file ~/.tmux.conf` in this file
# to inherit it inside cage tmux servers; operators with no override
# get the bundled conf unchanged. Don't override base-index /
# pane-base-index / allow-rename / automatic-rename — atmux's ADR-135
# window-naming invariants depend on them.
source-file -q "~/.config/atmux/tmux.conf.local"
