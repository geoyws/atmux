# atmux canonical tmux.conf (ADR-162 §Decision-anchor #2 + #3).
#
# DO NOT EDIT — atmux owns this file. The 8-option baseline pins the
# runtime contract for ADR-135 (window naming), ADR-138 (verified
# send-keys), and ADR-058 (cage-tier isolation). Operator overrides
# via the ATMUX_TMUX_CONF env var (returns the override verbatim;
# ADR-162 §Part B). A future user-override path at
# ~/.config/atmux/tmux.conf.local lands with ADR-163 (forward-ref);
# this file intentionally does NOT source-file it yet.
#
# atmux quarantines the operator's personal ~/.tmux.conf — every
# atmux invocation passes `-f <this-file>`, so inheritance is closed.

# Status line — atmux owns it.
set -g status on

# Operator convenience.
set -g mouse on

# Scrollback for capture-pane (ADR-138 send-keys verifier reads recent
# pane state; whip / poke / sentinel observation; refusal-classifier).
set -g history-limit 100000

# Color stability across operator terminals.
set -g default-terminal "tmux-256color"

# Window names: atmux owns the emoji-prefix formatter (ADR-135
# `buildWindowName`). tmux-side renaming MUST be off; otherwise the
# default-shell title overrides the canonical name on every pane spawn.
set -g allow-rename off
set -g automatic-rename off

# Match worktree-isolation conventions (ADR-082 / ADR-084).
set -g base-index 1

# Responsive but doesn't break esc-sequence emoji rendering on the
# cockpit window-name display.
set -g escape-time 50

# Prefix: tmux default C-b (no surprise for operators who attach
# directly via `tmux -L atmux-cockpit attach`). Custom prefixes belong
# in an ATMUX_TMUX_CONF override.

# User override (ADR-171) — silent no-op if file absent. Loaded LAST
# so operator-options override the bundled defaults. Operators with a
# curated ~/.tmux.conf can put `source-file ~/.tmux.conf` in this file
# to inherit it inside cage tmux servers; operators with no override
# get the bundled conf unchanged. Don't override base-index /
# pane-base-index / allow-rename / automatic-rename — atmux's ADR-135
# window-naming invariants depend on them.
source-file -q "~/.config/atmux/tmux.conf.local"
