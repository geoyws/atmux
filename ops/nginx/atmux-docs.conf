# /etc/nginx/sites-enabled/atmux-docs.conf
# atmux docs site — https://atmux.u-n-u-m.com
#
# This file lives in the repo at ops/nginx/atmux-docs.conf and is
# symlinked (or copied) into /etc/nginx/sites-enabled/ on hax.
#
# Cert path assumes per-host LE issuance (u-n-u-m.com has no wildcard;
# only ifca.app does). See docs/RUNBOOK-hosting.md for issuance steps.

# HTTP → HTTPS redirect + LE webroot challenge
server {
    listen 80;
    listen [::]:80;
    server_name atmux.u-n-u-m.com;

    # LE HTTP-01 challenge — must serve over HTTP unencrypted
    location /.well-known/acme-challenge/ {
        root /var/www/atmux-docs;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — primary site
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name atmux.u-n-u-m.com;

    # TLS — LE per-host cert
    ssl_certificate     /etc/letsencrypt/live/atmux.u-n-u-m.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/atmux.u-n-u-m.com/privkey.pem;

    # Modern TLS only
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Static-served VitePress build output
    root /var/www/atmux-docs;
    index index.html;

    # Pretty-URL routing — VitePress emits /path/index.html
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Long-cache static assets (VitePress hashes them)
    location ~* \.(css|js|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|webp|ico)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # Hide nginx version in Server header
    server_tokens off;

    # Security headers — docs site, low-risk surface
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 404 fallback
    error_page 404 /404.html;

    access_log /var/log/nginx/atmux-docs.access.log;
    error_log  /var/log/nginx/atmux-docs.error.log warn;
}
