# ci-bun — TS port gate (ADR-009 §6, reviewer 8-check protocol)
#
# Replaces the deprecated bash test workflow (deleted with the bash
# decommission per ADR-064 + PLAN.md Phase 4 cutover).
#
# Maps onto reviewer 8-check protocol:
#   step 1 typecheck         → "Typecheck" job step
#   step 2 coverage 100%     → "Bun test + coverage" + "Coverage gate" steps
#                              (emit lcov, then enforce via tests/lcov-gate.ts
#                              per ADR-009 §6 — Bun's coverageThreshold is
#                              parsed-but-no-op, validated in commit 600dc81)
#   step 3 biome lint+format → "Biome check" job step
#   steps 5-8 (silent-swallow / schema / ADR / conv-commit) — manual review
#                              + scripts/lint-discipline.ts (Phase 1 — ADR-006
#                              R1/R2/R6/R7/R11; foundation-porter deliverable).

name: ci-bun

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: typecheck + lint + test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun (pin 1.3.13 per package.json engines)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Cache Bun install + node_modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Install runtime deps for e2e (tmux >=3.4, jq)
        # ubuntu-24.04 ships tmux 3.4 + jq 1.7 in apt — no PPA needed.
        # tmux is required by the fallback-cage e2e and any other tests
        # that spawn a real tmux server; jq is used by a handful of
        # subprocess-shape integration tests. Both kept post-bash-
        # decommission for the e2e surface.
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux jq
          tmux -V
          jq --version

      - name: Typecheck (tsc --noEmit, strict)
        run: bun run typecheck

      - name: Biome lint + format check
        # `biome check` runs lint + format + assist in one pass; non-zero
        # on any diff or rule violation. Equivalent of legacy
        # `biome lint . && biome format --check .` from v1 syntax.
        run: bunx biome check .

      - name: Record cron baseline (t-e1247699 cron-leak guard pre)
        # Capture the count of `>>> atmux:team=` blocks BEFORE the test
        # run so the post-run delta check can detect bun-test leakage.
        # Runs on ephemeral ubuntu-24.04 — typically 0 blocks pre-run.
        run: bun scripts/check-cron-delta.ts --record /tmp/cron-baseline.txt

      - name: Bun test + coverage (emit lcov)
        # Bun's built-in `coverageThreshold` is parsed-but-no-op in 1.3.13
        # (ADR-009 §6, empirically validated in commit 600dc81). Coverage
        # is collected here; the gate fires in the next step via
        # tests/lcov-gate.ts.
        run: bun test --coverage --coverage-reporter=lcov

      - name: Cron-delta guard (t-e1247699 cron-leak guard post)
        # Fails the build if `bun test` left any new `>>> atmux:team=`
        # blocks in the host crontab — typical symptom of a fixture
        # that calls `atmux start` without an `afterEach` teardown
        # (root cause of t-e1247699 itself, per stale `/tmp/atmux-
        # lifecycle-*` blocks observed 2026-05-13). Recovery hint:
        # `atmux cron-orphans --prune`.
        if: always()
        run: bun scripts/check-cron-delta.ts --check /tmp/cron-baseline.txt

      - name: Coverage gate (lcov-gate, hand-rolled)
        # Per ADR-009 §6 + bunfig.toml header note: parses coverage/lcov.info,
        # applies coveragePathIgnorePatterns from bunfig.toml as the single
        # source of truth, computes per-file line/function/branch %, fails
        # nonzero with structured per-file breach report. Replaces Bun's
        # built-in self-enforce until upstream fixes the threshold no-op.
        # Phase 0 empty-skeleton case: "tracked: 0 files — vacuously passes"
        # is honest and explicit (no silent vacuous-green).
        run: bun tests/lcov-gate.ts

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: warn
          retention-days: 14
