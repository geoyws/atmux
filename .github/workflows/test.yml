name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux jq bats shellcheck

      - name: shellcheck
        run: |
          shellcheck -x -e SC1091,SC2154,SC2155,SC2016,SC2034 \
            bin/atmux lib/*.sh tests/helpers/*.bash

      - name: bats unit
        run: bats tests/unit/

      - name: bats e2e
        run: bats tests/e2e/
